<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f2efe8" />
    <script>
      try {
        var saved = localStorage.getItem("lc.theme");
        var dark = saved
          ? saved === "dark"
          : window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) {
          document.documentElement.classList.add("dark");
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", "#141311");
        }
      } catch (error) {}
    </script>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%231c1a16'/%3E%3Cpath d='M24 9c1.4 9.6 6.5 14.2 15 15-8.5.8-13.6 5.4-15 15-1.4-9.6-6.5-14.2-15-15 8.5-.8 13.6-5.4 15-15Z' fill='%23ff6b1a'/%3E%3Ccircle cx='35' cy='13' r='2.4' fill='%23f2efe8'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700;800;900&family=Doto:wght@400;600;700;900&family=Noto+Serif+TC:wght@500;600;700&display=swap"
    />
    <title>Learning Center</title>
  </head>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
